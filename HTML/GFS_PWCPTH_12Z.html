<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GFS - PMSL + Winds 10 m + Cloud Cover + Precip 3h + Thickness (500-1000 hPa) - 12Z</title>
  <link rel="stylesheet" href="styles/styles-player2.css">
  <script src="scripts/scripts-player2.js" defer></script>
</head>
<body onload="initialize()">
  <!-- Especificación de rutas de las imágenes -->
  <div id="image-config"
       data-images-path="Output//GFS//PWCPTH_12Z//"
       data-image-prefix="GFS_PWCPTH_12Z_"
       data-total-images="129"></div>

  <!-- Controles de Animación -->
  <aside class="controls">
    <h1>GFS</h1>
    <h2>PMSL + Winds 10 m + Cloud Cover + Precip 3h + Thickness (500-1000 hPa)</h2>
    <h2>12Z</h2>
    <button onclick="playAnimation()">Play</button>
    <button onclick="stopAnimation()">Stop</button>
    <button onclick="prevImage()">Prev</button>
    <button onclick="nextImage()">Next</button>
    <button onclick="changeSpeed(-50)">Speed +</button>
    <button onclick="changeSpeed(50)">Speed -</button>
  </aside>

  <!-- Área de Visualización -->
  <main>
    <canvas id="canvas" style="display: none;"></canvas>
    <img id="mainImage" alt="Satellite image">
    <span id="imageCounter"
          style="position: absolute;
                 bottom: 10px;
                 left: 10px;
                 background: rgba(0, 0, 0, 0.5);
                 color: white;
                 padding: 5px 10px;
                 border-radius: 5px;">
      Imagen 1 de 129
    </span>
  </main>
</body>
</html>
